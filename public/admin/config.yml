backend:
  name: github
  repo: wleklinskimateusz/template-next-decap

  commit_messages:
    create: 'Create {{collection}} "{{slug}}"'
    update: 'Update {{collection}} "{{slug}}"'
    delete: 'Delete {{collection}} "{{slug}}"'
    uploadMedia: 'Upload "{{path}}"'
    deleteMedia: 'Delete "{{path}}"'
    openAuthoring: '{{message}}'
publish_mode: editorial_workflow
media_folder: "public/images/uploads"
# only hardcoded because it isn't hosted on root
public_folder: "/template-next-decap/images/uploads"
# when using the default proxy server port
slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"
collections:
  - name: "articles" # Used in routes, e.g., /admin/collections/blog
    label: "Artykuły" # Used in the UI
    folder: "src/content/articles" # The path to the folder where the documents are stored
    create: true # Allow users to create new documents in this collection
    slug: "{{slug}}" # Filename template, e.g., YYYY-MM-DD-title.md
    fields: # The fields for each document, usually in front matter
      - label: "Tytuł"
        name: "title"
        widget: "string"
      - label: "Skrócony opis"
        name: "description"
        widget: "text"
      - label: "Data publikacji"
        name: "date"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        format: "YYYY-MM-DD"
        time_format: false
      - label: "Temat"
        name: "category"
        widget: "string"
        required: false
        hint: "Krótka etykieta, np. Kultura, Nauka, Podróże"
      - label: "Zawartość"
        name: "body"
        widget: "markdown"
      - label: "Seo Title"
        name: "seoTitle"
        widget: "string"
        required: false
      - label: "Seo Description"
        name: "seoDescription"
        widget: "text"
        required: false
      - label: "Seo Tags"
        name: "seoTags"
        widget: "list"
        required: false
      - label: "Layout"
        name: "layout"
        widget: "hidden"
        default: "blog"
      - label: "Obrazek"
        name: "image"
        widget: "image"
        required: false
  - name: "pages"
    label: "Strony"
    files: 
      - label: "Strona Główna"
        name: "homepage"
        file: "src/content/homepage.json"
        format: "json"
        fields:
          - label: "Seo Title"
            name: "seoTitle"
            widget: "string"
          - label: "Seo Description"
            name: "seoDescription"
            widget: "text"
          - label: "Seo Tags"
            name: "seoTags"
            widget: "list"
          - label: "Hero Tytuł"
            name: "heroTitle"
            widget: "string"